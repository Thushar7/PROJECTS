spring.application.name=movie-service-test
spring.datasource.url=jdbc:h2:mem:moviedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use Hibernate to manage schema for unit tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false

# Disable Flyway during lightweight JPA repository tests (MySQL-specific DDL not needed)
spring.flyway.enabled=false
