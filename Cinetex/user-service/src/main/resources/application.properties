spring.application.name=user-service

# Server configuration
server.port=8081

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
# (Optional) Uncomment if you need to allow mixing transactional/non-transactional statements
# spring.flyway.mixed=true

# MySQL datasource with automatic database creation
spring.datasource.url=jdbc:mysql://localhost:3306/user_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging for debugging
logging.level.org.springframework.web=DEBUG
logging.level.user_service.service=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT settings (aligned with gateway-service jwt.secret)

jwt.secret=DevelopingIsNotAPieceOfCake404ERROR
security.jwt.expiration=3600000

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue and Exchange Configuration for User Registration
rabbitmq.user.registration.exchange=user.registration.exchange
rabbitmq.user.registration.queue=user.registration.queue
rabbitmq.user.registration.routing-key=user.registered
