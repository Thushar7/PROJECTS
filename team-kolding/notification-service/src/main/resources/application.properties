spring.application.name=notification-service
server.port=8086

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinetix_notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Flyway managed)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchange / queue topology (booking related)
rabbitmq.notification.exchange=changelog.exchange
rabbitmq.notification.queue=notification.queue
rabbitmq.notification.routingkey=changelog.routingkey

# Movie added broadcast topology
rabbitmq.movie.exchange=movie.exchange
rabbitmq.movie.queue=movie.added.queue
rabbitmq.movie.routingkey=movie.added

# User registration queue for admin notifications
rabbitmq.user.registration.exchange=user.registration.exchange
rabbitmq.user.registration.queue=user.registration.queue
rabbitmq.user.registration.routing-key=user.registered

# User service base URL for internal user id fetch (correct port 8081)
user.service.base-url=http://localhost:8081