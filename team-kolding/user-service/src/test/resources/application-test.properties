spring.application.name=user-service-test

# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:user_service_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for unit tests (schema managed by Hibernate)
spring.flyway.enabled=false

# JWT settings for tests
security.jwt.secret=test-secret-key-that-is-long-enough-1234567890
security.jwt.expiration=60000
