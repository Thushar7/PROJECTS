<div class="auth-wrapper reset">
  <h1>Reset Password</h1>
  <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
    <label>New Password
      <input name="password" type="password" [(ngModel)]="password" required minlength="4" />
    </label>
    <label>Confirm Password
      <input name="confirm" type="password" [(ngModel)]="confirm" required minlength="4" />
    </label>
    <div class="error" *ngIf="password && confirm && password !== confirm">Passwords do not match</div>
    <div class="error" *ngIf="auth.error()">{{ auth.error() }}</div>
    <div class="success" *ngIf="success">Password updated successfully.</div>
    <div class="actions">
      <button type="button" class="secondary" (click)="goBack()">Back</button>
      <button type="submit" [disabled]="auth.loading() || f.invalid || password !== confirm">{{ auth.loading() ? 'Updating...' : 'Update Password' }}</button>
    </div>
  </form>
</div>
