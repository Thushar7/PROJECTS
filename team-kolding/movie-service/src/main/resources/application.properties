spring.application.name=movie-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/moviedb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (schema managed by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
# (Optional) Uncomment if you need to allow mixing transactional/non-transactional statements
# spring.flyway.mixed=true

# Server Configuration
server.port=8082

# Springdoc OpenAPI configuration
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=nexi.cinetix.movie_service.controller
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# RabbitMQ movie event configuration
rabbitmq.movie.exchange=movie.exchange
rabbitmq.movie.routingkey=movie.added

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
